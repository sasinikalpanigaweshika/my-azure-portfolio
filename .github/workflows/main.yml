name: Deploy to Azure VM

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: 104.43.112.161
          username: azureuser
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd ~/myapp
            pm2 restart app
